<button id="chat-toggle" class="chat-toggle" aria-label="Otevřít chatbot" aria-expanded="false" aria-controls="chat-panel">
  <svg id="chat-icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  <svg id="chat-icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" class="is-hidden"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>
<div id="chat-panel" class="chat-panel" role="dialog" aria-label="Chatbot" aria-hidden="true">
  <div class="chat-header">
    <div class="chat-avatar">G</div>
    <div>
      <div class="chat-name">Rychlé odpovědi</div>
      <div class="chat-status">Automatický pomocník</div>
    </div>
    <button type="button" id="chat-close" class="chat-close" aria-label="Zavřít chatbot">×</button>
  </div>
  <div class="chat-messages" id="chat-messages" role="log" aria-label="Zprávy v chatu" aria-live="polite" aria-relevant="additions"></div>
  <div class="chat-input-row">
    <input id="chat-input" class="chat-input" type="text" placeholder="Napište otázku…" autocomplete="off" aria-label="Zpráva">
    <button id="chat-send" class="chat-send" aria-label="Odeslat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>
