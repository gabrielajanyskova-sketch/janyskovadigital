<section class="webtest" aria-labelledby="webtest-title">
  <div class="container">
    <div class="webtest-box reveal">
      <div class="webtest-text">
        <div class="section-tag">Bezplatný test webu</div>
        <h2 class="section-title" id="webtest-title">Jak si stojí <em>váš web?</em></h2>
        <p>Za minutu zjistíte rychlost na mobilu, chyby v SEO, bezpečnost, GDPR a hlavně to, jestli váš web smí číst <strong>ChatGPT, Claude a Perplexity</strong>. Česky, s návodem, co opravit.</p>
      </div>
      <form class="webtest-form" action="https://testwebu.janyskovadigital.cz/" method="GET">
        <label for="webtest-url" class="visually-hidden">Adresa vašeho webu</label>
        <input id="webtest-url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="vas-web.cz" required spellcheck="false">
        <button type="submit" class="btn-primary">Otestovat web zdarma</button>
      </form>
      <p class="webtest-note">Bez registrace · výsledek za minutu <a href="https://testwebu.janyskovadigital.cz/" class="webtest-more">Co test zkontroluje <span aria-hidden="true">→</span></a></p>
    </div>
  </div>
</section>
