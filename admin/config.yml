            widget: text
          - label: "Postup — krok 4: nadpis"
            name: process4_h3
            widget: string
          - label: "Postup — krok 4: text"
            name: process4_p
            widget: text

          - label: "FAQ 1 — otázka"
            name: faq1_q
            widget: string
          - label: "FAQ 1 — odpověď"
            name: faq1_a
            widget: text
          - label: "FAQ 2 — otázka"
            name: faq2_q
            widget: string
          - label: "FAQ 2 — odpověď"
            name: faq2_a
