backend:
  name: github
  repo: gabrielajanyskova-sketch/janyskovadigital
  branch: main
  base_url: https://janyskovadigital.cz
  auth_endpoint: /api/auth

locale: cs
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: hlavni_stranka
    label: Hlavní stránka
    files:
      - name: obsah
        label: Texty na hlavní stránce
        file: content/hlavni-stranka.yml
        fields:
          - label: "Hero — hlavní nadpis"
            name: hero_title
            widget: string
            hint: "HTML tagy povoleny (<em>, <br>, &nbsp;)"
          - label: "Hero — podnadpis"
            name: hero_sub
            widget: string

          - label: "O mně — úvodní odstavec"
            name: about_intro
            widget: text
            hint: "HTML tagy povoleny (<strong> apod.)"
          - label: "O mně — bio"
            name: about_bio
            widget: text

          - label: "Proč já — karta 1: nadpis"
            name: trust1_h3
            widget: string
          - label: "Proč já — karta 1: text"
            name: trust1_p
            widget: text
          - label: "Proč já — karta 2: nadpis"
            name: trust2_h3
            widget: string
          - label: "Proč já — karta 2: text"
            name: trust2_p
            widget: text
          - label: "Proč já — karta 3: nadpis"
            name: trust3_h3
            widget: string
          - label: "Proč já — karta 3: text"
            name: trust3_p
            widget: text
          - label: "Proč já — karta 4: nadpis"
            name: trust4_h3
            widget: string
          - label: "Proč já — karta 4: text"
            name: trust4_p
            widget: text
          - label: "Proč já — karta 5: nadpis"
            name: trust5_h3
            widget: string
          - label: "Proč já — karta 5: text"
            name: trust5_p
            widget: text
            hint: "HTML tagy povoleny (odkaz na /novy-jicin/ je tam zabudovaný)"
          - label: "Proč já — karta 6: nadpis"
            name: trust6_h3
            widget: string
          - label: "Proč já — karta 6: text"
            name: trust6_p
            widget: text

          - label: "Recenze 1 — text"
            name: review1_text
            widget: text
            hint: "Text recenze Jaroslava Slonka"
          - label: "Recenze 2 — text"
            name: review2_text
            widget: text
            hint: "Text recenze Niky Hubáčkové"

          - label: "Postup — krok 1: nadpis"
