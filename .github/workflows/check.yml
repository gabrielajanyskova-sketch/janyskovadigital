name: Kontrola webu

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sestavené soubory odpovídají zdrojům v src/
        run: git diff --exit-code || (echo "::error::Spusťte npm run build a commitněte výstup." && exit 1)
      - run: npm run check
