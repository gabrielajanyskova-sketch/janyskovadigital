name: Sestavení a kontrola webu

# Na main (včetně úprav z CMS) web sestaví, zkontroluje a hotové soubory sám commitne.
# Cloudflare Pages pak nasadí výsledek. Na ostatních větvích a v PR jen kontroluje.

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run testwebu:test

      - name: Uložit sestavené soubory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Sestavené soubory jsou aktuální."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automatické sestavení webu"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Sestavené soubory odpovídají zdrojům
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: git diff --exit-code || (echo "::error::Spusťte npm run build a commitněte výstup." && exit 1)
