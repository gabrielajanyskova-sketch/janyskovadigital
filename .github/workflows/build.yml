name: Sestavení a kontrola webu
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run testwebu:test
      - run: npm run test:penetration
      - name: Generované soubory odpovídají zdrojům
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
