hero_title: "Dělám weby,<br>které vás <em>zviditelní</em><br>v&nbsp;online světě."
hero_sub: "Stavím weby čistým kódem, bez WordPressu a bez měsíčních poplatků. Za 48 hodin máte první náhled."
about_intro: "Dělám weby, které vás zviditelní v online světě — a jdu do toho naplno. Každý web stavím sama, čistým kódem, bez šablon a bez WordPressu. Jsem z <strong>Nového Jičína</strong>, ale klienty mám po celé ČR."
about_bio: "Webdesignu se věnuji 5 let. Začínala jsem na WordPressu, ale frustrace z pomalých webů závislých na pluginech mě přivedla k čistému HTML, CSS a JavaScriptu. Dneska díky tomu dostanete web, který se načte pod vteřinu a nic vám extra neplatíte. Jsem samouk — a jsem na to hrdá. Absolvovala jsem kurz Specialistka AI a Juniorní akademii od Holek z marketingu a pořád se učím."

trust1_h3: "Rychlost, která prodává"
trust1_p: "Tři sekundy načítání a polovina návštěvníků odejde. Moje weby se načítají pod sekundu — a Google to odměňuje lepšími pozicemi."
trust2_h3: "Žádné měsíční faktury"
trust2_p: "U jiných platíte za hosting 2–5 tisíc ročně. U mě je hosting v ceně webu. Dál platíte jen doménu — přibližně 200 Kč ročně."
trust3_h3: "Web bez starostí"
trust3_p: "WordPress potřebuje neustálé aktualizace a záplaty. Čistý kód nic z toho nepotřebuje. Spustím web a vy se věnujete byznysu."
trust4_h3: "Najdou vás i AI vyhledávače"
trust4_p: "Každý web stavím tak, aby vás našel nejen Google, ale i ChatGPT nebo Perplexity. Většina webdesignerů tohle ještě neřeší. Já ano."
trust5_h3: "Lokální znalost"
trust5_p: "Vím, jak funguje podnikání v regionu. Vaše zákazníky hledám tam, kde jsou — v <a href=\"/novy-jicin/\" style=\"color:var(--pink);font-weight:600;\">Novém Jičíně</a>, Ostravě, Frýdku-Místku, Hranicích, Kopřivnici, Příboře i okolí."
trust6_h3: "Jsem tu i po spuštění"
trust6_p: "Potřebujete změnit cenu nebo přidat fotku? Napište — odpovídám do 24 hodin. Nejste číslo ve frontě, jste klient."

review1_text: "„Paní Janýškovou jsem oslovil s tím, že chci moderní web, který bude reprezentovat moje služby. Průběžně mě informovala o postupu, na připomínky reagovala rychle a bez zbytečných průtahů. Výsledný web je přehledný, rychlý, dobře dohledatelný na Googlu a — co je pro mě jako finančního poradce klíčové — budí důvěru. Pokud hledáte webařku, která odvede poctivou práci a dá si na ní záležet, můžu Vám paní Janýškovou jen doporučit.""
review2_text: "„S novým webem jsem naprosto spokojená. Paní odvádí skvělou práci a hlavní plus pro mě je, že za skvěle fungující stránky nemusím platit zbytečně moc peněz. Komunikace byla po celou dobu super, na všem jsme se bez problému domluvily a vše proběhlo v naprostém pořádku. Určitě doporučuji!""

process1_h3: "Napíšete mi"
process1_p: "Řeknete mi co potřebujete — já vám řeknu co by dávalo smysl a co to bude stát. Žádné technické řeči, žádné závazky."
process2_h3: "Dám se do práce"
process2_p: "Každý web dělám od nuly, v čistém kódu, přesně pro vás. Průběžně vám ukážu jak to vypadá — žádná překvapení na konci."
process3_h3: "Spustíme to"
process3_p: "Předám vám přístupy, propojím web s Googlem a jdeme na to. Od teď vás zákazníci najdou."
process4_h3: "Jsem tu dál"
process4_p: "Potřebujete něco změnit nebo přidat? Napište mi. Odpovídám do 24 hodin a nejste číslo ve frontě."

faq1_q: "Proč neplatím za hosting?"
faq1_a: "Weby stavím čistým kódem bez WordPressu. Hosting je součástí ceny tvorby — platíte jen doménu, přibližně 200 Kč ročně."
faq2_q: "Budu moci web v budoucnu sama upravovat?"
faq2_a: "Ano — ale ne přes složitý redakční systém. Drobné změny (text, fotka, cena) mi napište a udělám je obvykle do 24–48 hodin, v ceně pokud jsou malé. Na větší úpravy je tu <strong>Web Care od 490 Kč/měs</strong> — správu webu přebírám já a vy řešíte byznys. Čistý kód na rozdíl od WordPressu nevyžaduje aktualizace pluginů ani záplaty — web prostě funguje."
faq3_q: "Jak dlouho trvá tvorba webu?"
faq3_a: "Menší weby mívám hotové do 7–10 dnů od chvíle, kdy dostanu podklady. U rozsáhlejších projektů se domluvíme na harmonogramu."
faq4_q: "Pomůžete mi s výběrem domény?"
faq4_a: "Jasně! Společně vymyslíme ideální název a ukážu vám, kde a jak ji nejvýhodněji koupit přímo na vaše jméno."
faq5_q: "Děláte i SEO optimalizaci webu?"
faq5_a: "Ano — SEO je součástí každého webu, který tvořím. Každá stránka dostane správnou strukturu nadpisů, meta tagy, Schema.org data a sitemap. U vícestránkových webů dělám i analýzu klíčových slov a lokální SEO optimalizaci pro váš region."
faq6_q: "Tvoříte weby i mimo Nový Jičín?"
faq6_a: "Ano, spolupráce probíhá kompletně online. Weby tvořím pro klienty z celé České republiky."
faq7_q: "Kolik stojí webové stránky v Novém Jičíně?"
faq7_a: "Tvorba webových stránek začíná od 5 900 Kč za one-page web. Vícestránkový web od 12 000 Kč. Hosting je v ceně tvorby."
faq8_q: "Jaký je rozdíl mezi čistým kódem a WordPressem?"
faq8_a: "WordPress vyžaduje placený hosting, pravidelné aktualizace pluginů a je náchylnější k útokům. Čistý kód je rychlejší, levnější na provoz a bezpečnější — weby dosahují PageSpeed 95–100 bodů."
faq9_q: "Potřebuji web i když mám sociální sítě?"
faq9_a: "Ano. Sociální sítě jsou pronajatý prostor — dosah závisí na algoritmu, platformy mění podmínky. Vlastní web je vaše digitální adresa viditelná ve vyhledávačích, kde lidé aktivně hledají vaše služby."
faq10_q: "Co je AEO optimalizace?"
faq10_a: "AEO (Answer Engine Optimization) je optimalizace webu pro AI nástroje jako ChatGPT, Perplexity nebo Google AI Mode. Zahrnuje strukturované FAQ, Schema.org data a jasné citovatelné odpovědi."
faq11_q: "Co je Web Refresh?"
faq11_a: "Převod stávajícího WordPressu nebo jiné platformy na čistý kód. Výsledkem je rychlejší web bez drahého hostingu a bezpečnostních rizik. Od 8 900 Kč."
faq12_q: "Kolik stojí správa webu?"
faq12_a: "Web Care začíná od 490 Kč měsíčně. Zahrnuje aktualizace obsahu, technický dohled a měsíční report z Google Search Console."
